name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build extra-cmake-modules \
            qt6-base-dev qt6-tools-dev \
            libkf6coreaddons-dev libkf6i18n-dev libkf6xmlgui-dev libkf6widgetsaddons-dev libkf6auth-dev \
            appstream

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: Fuzz (short run)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build extra-cmake-modules clang libclang-rt-dev \
            qt6-base-dev qt6-tools-dev \
            libkf6coreaddons-dev libkf6i18n-dev libkf6xmlgui-dev libkf6widgetsaddons-dev libkf6auth-dev

      - name: Build fuzzers
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz

      - name: Fuzz the fstab parser (1 minute)
        run: |
          mkdir -p corpus-fstab
          build/fuzz/bin/fstab_fuzzer -max_total_time=60 -max_len=8192 corpus-fstab tests/data

      - name: Fuzz the permission rules (1 minute)
        run: |
          mkdir -p corpus-policy
          build/fuzz/bin/policy_fuzzer -max_total_time=60 -max_len=4096 corpus-policy fuzz/seeds/policy

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
